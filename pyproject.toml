[project]
name = "grid-mind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AnuvratP12", email = "anuvratpathak12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
]

[project.scripts]
